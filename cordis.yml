- id: logger
  name: '@deepseek-ai/cordis-plugin-logger-console'
- id: timer
  name: '@deepseek-ai/cordis-plugin-timer'
- id: hmr
  name: '@deepseek-ai/cordis-plugin-hmr'
  disabled: !!js process.env.NODE_ENV === 'production'
  config:
    root:
      - ./src
- id: server
  name: ./src/plugins/server-node.ts
  config:
    host: !!js process.env.HOST ?? '127.0.0.1'
    port: !!js Number(process.env.PORT ?? 3000)
- id: healthz
  name: ./src/plugins/healthz.ts
- id: hooks
  name: ./src/plugins/hooks.ts
- id: ingest-http
  name: ./src/plugins/ingest-http.ts
  config:
    waitMs: 10000
- id: store
  name: ./src/plugins/store-sqlite.ts
  config:
    path: !!js process.env.HOOKY_DB ?? './data/hooky.db'
    retentionDays: 30
- id: outbox
  name: ./src/plugins/outbox.ts
  config:
    attempts: 8
    baseDelayMs: 30000
    maxDelayMs: 3600000
- id: routes
  name: ./src/plugins/hook-routes.ts
  config:
    always:
      - console
    seedSecret: !!js process.env.HOOKY_SECRET
    seed:
      - name: urgent
        description: Wakes me up. Telegram and ntfy both.
        targets:
          - channel: telegram
          - channel: ntfy
      - name: notice
        description: Worth knowing, not worth a push on two devices.
        targets:
          - channel: telegram
- id: ask
  name: ./src/plugins/ask.ts
  config:
    # A reply link is opened by a person, and the agent that asks the question may
    # well reach this instance on 127.0.0.1. Empty derives the base from the
    # request, which is right behind a reverse proxy and wrong on localhost.
    publicUrl: !!js process.env.HOOKY_PUBLIC_URL ?? ''
    # How long a call with actions in it holds its answer when the payload does
    # not say. `wait` in the payload overrides it, up to maxWaitMs.
    waitMs: 60000
- id: api
  name: ./src/plugins/api.ts
  config:
    secret: !!js process.env.HOOKY_SECRET
- id: ui
  name: ./src/plugins/ui.ts
- id: skill
  name: ./src/plugins/skill.ts
  config:
    secret: !!js process.env.HOOKY_SECRET
- id: agents-txt
  name: ./src/plugins/agents-txt.ts
  config:
    # An hour in production, no-store on a dev instance. Quoted, because YAML
    # reads an unquoted `: ` as a mapping key and the row then fails to mount.
    cacheSeconds: !!js 'process.env.NODE_ENV === ''production'' ? 3600 : 0'
- id: rate-limit
  name: ./src/plugins/rate-limit.ts
  config:
    perChannel: 20
    windowMs: 60000
- id: retry
  name: ./src/plugins/retry.ts
  config:
    attempts: 3
    baseDelayMs: 500
    maxDelayMs: 8000
- id: console
  name: ./src/plugins/channel-console.ts
- id: telegram
  name: ./src/plugins/channel-telegram.ts
  disabled: !!js (!process.env.TELEGRAM_TOKEN)
  config:
    token: !!js process.env.TELEGRAM_TOKEN
    chatId: !!js process.env.TELEGRAM_CHAT_ID
- id: teams
  name: ./src/plugins/channel-teams.ts
  config:
    # Empty on purpose, and the row mounts anyway. A trigger url is one Teams
    # channel, so it belongs to the target: set it per hook in the UI, or with
    # `hooks target <hook> teams --set webhook=…`. Fill this in only when every
    # hook posts to the same Teams channel.
    webhook: !!js process.env.TEAMS_WEBHOOK ?? ''
- id: sse
  name: ./src/plugins/channel-sse.ts
  config:
    # A subscriber proves it may listen: this token for any hook, or the hook's
    # own secret for that one hook. Couple the channel to a hook first, or the
    # stream endpoint answers 409 and tells you nothing would arrive.
    secret: !!js process.env.HOOKY_SECRET
- id: ntfy
  name: ./src/plugins/channel-ntfy.ts
  config:
    server: !!js process.env.NTFY_SERVER ?? 'https://ntfy.sh'
    # A topic is a destination, so it normally sits on the target: per hook, in
    # the UI, or with `hooks target <hook> ntfy --set topic=…`. This is the
    # default for when every hook publishes to the same topic. Without either,
    # the delivery is skipped and says so.
    topic: !!js process.env.NTFY_TOPIC ?? ''
    token: !!js process.env.NTFY_TOKEN ?? ''
